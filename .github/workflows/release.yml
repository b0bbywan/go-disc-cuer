name: Release

on:
  push:
    tags:
      - 'v[0-9]*'  # stable: vX.Y.Z — pre-release: vX.Y.Z-alpha.W / -beta.W / -rc.W

permissions:
  contents: write  # required to create the release and upload assets

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history + tags so `make dist` stamps the release version
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.23'
          cache: true
      - name: Install libdiscid
        run: make deps
      - name: Build amd64 artifact
        run: make dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # SemVer pre-releases carry a hyphen after the version (v1.2.3-alpha.1,
          # -beta.2, -rc.1); a bare vX.Y.Z is a stable release.
          prerelease=""
          case "$tag" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$tag" dist/* \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            $prerelease
